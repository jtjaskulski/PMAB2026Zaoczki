services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bike_db
    environment:
      SA_PASSWORD: "YourStrong!Pass123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bike_api

    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Database=BikeRentalDb;User Id=sa;Password=YourStrong!Pass123;TrustServerCertificate=True;"

    ports:
      - "5000:8080"

    depends_on:
      - db